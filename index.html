<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Secure Log Uploader</title>
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3e%3cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z' fill='%23667eea'/%3e%3cpath d='M14 2v6h6' stroke='%23764ba2' stroke-width='2' fill='none'/%3e%3cpath d='M12 11v6' stroke='white' stroke-width='2'/%3e%3cpath d='M15 14l-3-3-3 3' stroke='white' stroke-width='2' fill='none'/%3e%3c/svg%3e">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Secure Log Uploader</h1>
            <p>Upload log bundles directly to secure storage</p>
        </div>

        <form id="uploadForm">
            <!-- Test-mode field: in production the presigned URL is fetched from
                 the broker behind Cloudflare Access and this stays hidden. -->
            <div class="form-group" id="presignedUrlGroup">
                <label for="presignedUrl">Upload URL (staging test only)</label>
                <input type="text" id="presignedUrl" placeholder="Fetched automatically, or paste a presigned URL to test" autocomplete="off">
            </div>

            <div class="form-group">
                <label>File to Upload</label>
                <div class="file-input">
                    <input type="file" id="fileInput" required>
                    <label for="fileInput" class="file-input-label">
                        📁 Choose file or drag & drop
                    </label>
                </div>
            </div>

            <button type="submit" class="upload-btn" id="uploadBtn">
                Start Upload
            </button>
        </form>

        <div class="progress-container" id="progressContainer">
            <div class="progress-text" id="progressText">Preparing upload...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="upload-stats">
                <span id="uploadSpeed">0 MB/s</span>
                <span id="uploadEta">Calculating...</span>
            </div>
        </div>

        <div id="errorMsg"></div>
        <div id="successMsg"></div>
    </div>

    <script type="module" src="uploader.js"></script>
</body>
</html>
