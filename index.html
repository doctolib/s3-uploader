<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>S3 Uploader</title>
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3e%3cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z' fill='%23667eea'/%3e%3cpath d='M14 2v6h6' stroke='%23764ba2' stroke-width='2' fill='none'/%3e%3cpath d='M12 11v6' stroke='white' stroke-width='2'/%3e%3cpath d='M15 14l-3-3-3 3' stroke='white' stroke-width='2' fill='none'/%3e%3c/svg%3e">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 S3 Uploader</h1>
            <p>Upload files to S3 with a presigned URL or AWS credentials</p>
        </div>

        <form id="uploadForm">
            <div class="form-group">
                <label class="mode-toggle">
                    <input type="checkbox" id="usePresigned">
                    Use presigned URL (no AWS credentials needed)
                </label>
            </div>

            <!-- Presigned mode: paste a presigned PUT URL. -->
            <div id="presignedFields">
                <div class="form-group">
                    <label for="presignedUrl">Upload URL</label>
                    <input type="text" id="presignedUrl" placeholder="Paste a presigned PUT URL" autocomplete="off">
                    <p class="field-note">Single PUT only — no multipart, no resume. File must be 5 GB or smaller.</p>
                </div>
            </div>

            <!-- Credential mode: kept for other use cases (multipart upload). -->
            <div id="credentialFields">
                <div class="form-group">
                    <label for="accessKey">AWS Access Key</label>
                    <input type="text" id="accessKey" placeholder="AKIA..." autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="secretKey">AWS Secret Key</label>
                    <input type="password" id="secretKey" placeholder="Your secret key" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="bucketName">S3 Bucket Name</label>
                    <input type="text" id="bucketName" placeholder="my-bucket">
                </div>

                <div class="form-group">
                    <label for="chunkSize">Chunk Size</label>
                    <select id="chunkSize">
                        <option value="20">20 MB</option>
                        <option value="50">50 MB</option>
                        <option value="100" selected>100 MB</option>
                        <option value="200">200 MB</option>
                        <option value="500">500 MB</option>
                        <option value="1024">1 GB</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="objectName">S3 Object Name (optional)</label>
                    <input type="text" id="objectName" placeholder="Leave empty to keep original filename">
                </div>
            </div>

            <div class="form-group">
                <label>File to Upload</label>
                <div class="file-input">
                    <input type="file" id="fileInput" required>
                    <label for="fileInput" class="file-input-label">
                        📁 Choose file or drag & drop
                    </label>
                </div>
            </div>

            <button type="submit" class="upload-btn" id="uploadBtn">
                Start Upload
            </button>
        </form>

        <div class="progress-container" id="progressContainer">
            <div class="progress-text" id="progressText">Preparing upload...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="upload-stats">
                <span id="uploadSpeed">0 MB/s</span>
                <span id="uploadEta">Calculating...</span>
            </div>
        </div>

        <div id="errorMsg"></div>
        <div id="successMsg"></div>

        <!-- Resume dialog (credential mode) -->
        <div class="overwrite-dialog" id="resumeDialog">
            <div class="overwrite-content">
                <h3>🔄 Resume Upload</h3>
                <p id="resumeMessage">An interrupted upload was found. Do you want to resume it?</p>
                <div class="overwrite-buttons">
                    <button class="btn-secondary" id="cancelResume">Start New Upload</button>
                    <button class="btn-primary" id="confirmResume">Yes, Resume</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="uploader.js"></script>
</body>
</html>
